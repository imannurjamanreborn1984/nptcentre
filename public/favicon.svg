<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#nptGrad)"/>
  
  <!-- Subtle Inner White Ring -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Center White Emblem (Open Book & Spiritual Flame) -->
  <g transform="translate(106, 116)" filter="url(#glow)">
    <!-- Book Spine & Pages -->
    <path d="M150 220 C100 200 40 200 10 215 L10 70 C40 55 100 55 150 75 C200 55 260 55 290 70 L290 215 C260 200 200 200 150 220 Z" 
          fill="#ffffff" 
          fill-opacity="0.95" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linejoin="round"/>
    
    <!-- Central Divider -->
    <path d="M150 75 L150 220" stroke="#be123c" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Spiritual Flame / Light on top of book -->
    <path d="M150 5 C165 30 180 45 150 65 C120 45 135 30 150 5 Z" fill="#fbbf24"/>
    <circle cx="150" cy="38" r="7" fill="#ffffff"/>
  </g>

  <!-- NPT Text Badge at Bottom -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="6">
    NPT
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" fill="#fecdd3" letter-spacing="2">
    HAKIKAT CINTA
  </text>
</svg>